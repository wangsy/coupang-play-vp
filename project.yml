# XcodeGen spec. `xcodegen generate` writes CoupangPlayVP.xcodeproj (not committed).
name: CoupangPlayVP
options:
  deploymentTarget:
    visionOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: ko
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CoupangPlayVP:
    type: application
    platform: visionOS
    sources:
      - path: App
        excludes:
          - Resources
      - path: App/Resources
        buildPhase: resources
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 쿠팡플레이 VP
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
  CoupangPlayVPTests:
    type: bundle.unit-test
    platform: visionOS
    sources:
      - path: Tests/CoupangPlayVPTests
    dependencies:
      - target: CoupangPlayVP
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).coupangplay-vp.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CoupangPlayVP:
    build:
      targets:
        CoupangPlayVP: all
        CoupangPlayVPTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoupangPlayVPTests
